<dialog id="model-dialog"><div class="dialog-heading"><div><div class="eyebrow">BRING YOUR OWN MODEL</div><h2>添加一个新方法</h2></div><button id="close-dialog" type="button" aria-label="关闭">×</button></div><p class="small">只比较方法介绍？直接填写下面的表单。已有实验？选择 JSON 文件，文件内容将优先于手动填写。</p><form id="import-form"><div class="form-grid"><label>模型名称<input id="custom-name" maxlength="50" placeholder="例如：Rectified Flow"></label><label>方法定位<input id="custom-category" maxlength="80" value="用户添加模型"></label></div><label>方法简介<textarea id="custom-summary" maxlength="500" rows="2" placeholder="简要说明模型做什么"></textarea></label><div class="form-grid"><label>主要优势（每行一条）<textarea id="custom-pros" rows="3" placeholder="训练流程简洁"></textarea></label><label>局限与取舍（每行一条）<textarea id="custom-cons" rows="3" placeholder="需要验证少步生成质量"></textarea></label></div><div class="file-box"><label>或导入实验 JSON<input id="model-file" type="file" accept=".json,application/json"></label><button id="download-template" type="button">↓ 下载 JSON 模板</button></div><p class="small">支持单个模型或已导出的模型列表。可选字段：8×8 灰度样本（每张 64 个 0–255 整数）、标签、轨迹与指标。最多 100 张样本、20 帧、1 MB/文件、8 个自定义模型。无指标时显示“未提供”。</p><p class="small">文件仅在浏览器解析，不上传服务器，不执行模型代码或权重。模型与数据保存于本机浏览器；清除网站数据会删除它们。比较指标前请核对数据集、硬件和计时口径。</p><p id="import-error" class="error" role="alert"></p><button class="primary" type="submit">添加到对比实验室</button></form></dialog>
