    if (event.target instanceof globalThis.Element) {
      element = event.target;
    } else if (event.target instanceof globalThis.Node) {
      element = event.target.parentElement;
    }
    const link = element?.closest(&quot;a[href]&quot;);
    const href = link?.getAttribute(&quot;href&quot;);
    if (href == null) {
      return;
    }
    if (href.startsWith(&quot;#&quot;)) {
      let id;
      try {
        id = decodeURIComponent(href.slice(1));
      } catch {
        return;
      }
      const target = id.length === 0 ? root : document.getElementById(id);
      if (
        target == null ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      event.preventDefault();
      postToHost(&quot;scroll-to&quot;, {
        top: target.getBoundingClientRect().top + globalThis.scrollY,
      });
      return;
    }
    event.preventDefault();
    openExternal({ href });
  });
  new ResizeObserver(sendHeight).observe(document.body);
  syncTheme();
})();

&lt;/script&gt;
&lt;div id=&quot;widar-csi-walkthrough&quot;&gt;
  &lt;h2&gt;CSI → DFS → BVP：从零开始读懂信号处理&lt;/h2&gt;
  &lt;p&gt;可以把无线电波想成看不见的“探路波”：它沿不同路线到达接收机，碰到运动的人，留下的记录会变化。下面从这些记录开始，一步步估计人体的速度分布。&lt;/p&gt;
  &lt;div class=&quot;text-small&quot;&gt;每步先看日常解释，再看术语、公式和原代码。比喻帮助理解，实际计算以公式和代码为准。&lt;/div&gt;

  &lt;details&gt;
    &lt;summary&gt;公式里常见符号怎么读？&lt;/summary&gt;
    &lt;dl&gt;
      &lt;dt&gt;Σ：求和&lt;/dt&gt;&lt;dd&gt;把指定的一组数加起来，像算一篮东西的总价。&lt;/dd&gt;
      &lt;dt&gt;|x|：大小&lt;/dt&gt;&lt;dd&gt;对普通数取不带正负号的大小；对复数取箭头长度。|x|²就是这个大小再乘自己一次。&lt;/dd&gt;
      &lt;dt&gt;j：虚数单位&lt;/dt&gt;&lt;dd&gt;这里与复数一起表示相位方向，不是接收机编号。&lt;/dd&gt;
      &lt;dt&gt;dφ/dt：变化速率&lt;/dt&gt;&lt;dd&gt;相位在很短的时间内变了多少，再除以这段时间；像用路程变化算速度。&lt;/dd&gt;
      &lt;dt&gt;arg / angle&lt;/dt&gt;&lt;dd&gt;取复数箭头的角度，也就是相位。&lt;/dd&gt;
      &lt;dt&gt;‖向量‖&lt;/dt&gt;&lt;dd&gt;取向量长度，例如两个位置相减得到一段位移，再取长度就是它们的距离。&lt;/dd&gt;
      &lt;dt&gt;∈、≠、≤&lt;/dt&gt;&lt;dd&gt;分别读作“属于”“不等于”“小于或等于”。&lt;/dd&gt;
      &lt;dt&gt;argmax、min&lt;/dt&gt;&lt;dd&gt;argmax找让结果最大的选项；min在这里表示寻找最小值，具体含义要看公式上下文。&lt;/dd&gt;
      &lt;dt&gt;1e−7&lt;/dt&gt;&lt;dd&gt;表示0.0000001，是非常小的一个数。&lt;/dd&gt;
      &lt;dt&gt;Tᵣ、k、i、j&lt;/dt&gt;&lt;dd&gt;Tᵣ是第r个接收机的包数；k、i、j常用来编号。数学中的虚数j和代码里的循环编号j，要按所在位置区分。&lt;/dd&gt;
    &lt;/dl&gt;
  &lt;/details&gt;
  &lt;h3&gt;实际代码与位置&lt;/h3&gt;
  &lt;div id=&quot;wc-code&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;text-small&quot;&gt;电脑上的项目根目录：E:\all\Widar3.0Release-Matlab。文件位置均相对此目录；左侧数字就是行号。&lt;/div&gt;
  &lt;script type=&quot;application/json&quot; id=&quot;wc-payload&quot;&gt;{&quot;steps&quot;: [{&quot;label&quot;: &quot;启动与文件路径&quot;, &quot;origin&quot;: &quot;我新增的入口&quot;, &quot;before&quot;: &quot;样本名称&quot;, &quot;after&quot;: &quot;6 个接收机文件&quot;, &quot;kind&quot;: &quot;files&quot;, &quot;formula&quot;: &quot;文件名 = 路径前缀 + “-r” + 接收机编号 + “.dat”&quot;, &quot;why&quot;: &quot;就像给六个观测位置分别贴编号。入口指定样本，作者函数循环把 r1 到 r6 拼进文件名。同一组处理重复六次，不需要复制六份算法。此处只是启动，还没有生成频谱。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;step1_csi_to_dfs.m&quot;, &quot;first&quot;: 3, &quot;last&quot;: 5, &quot;text&quot;: &quot;  3  root = setup_reproduction(1);\n  4  sample = &#x27;userA-1-1-1-1&#x27;;\n  5  prefix = fullfile(root,&#x27;Data&#x27;,sample);&quot;}, {&quot;file&quot;: &quot;step1_csi_to_dfs.m&quot;, &quot;first&quot;: 19, &quot;last&quot;: 19, &quot;text&quot;: &quot; 19  [dfs_fft,freq_fft] = get_doppler_spectrum(prefix,6,3,&#x27;stft&#x27;);&quot;}, {&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 23, &quot;last&quot;: 30, &quot;text&quot;: &quot; 23  for ii = 1:rx_cnt\n 24      spth = [spfx_ges, &#x27;-r&#x27;, num2str(ii), &#x27;.dat&#x27;];\n 25      try\n 26          [csi_data, ~] = csi_get_all(spth);\n 27      catch err\n 28          disp(err)\n 29          continue\n 30      end&quot;}], &quot;technicalWhy&quot;: &quot;就像给六个观测位置分别贴编号。入口指定样本，作者函数循环把 r1 到 r6 拼进文件名。同一组处理重复六次，不需要复制六份算法。此处只是启动，还没有生成频谱。&quot;, &quot;plainLabel&quot;: &quot;选好要处理的文件&quot;, &quot;plainWhy&quot;: &quot;先告诉电脑：这次要看哪一个人的哪一次动作。这个动作被6个接收机从不同位置记录下来，像同一场表演由6台摄像机同时拍摄。电脑按编号依次打开6个文件，再用同一套方法处理。&quot;, &quot;formulaReading&quot;: &quot;把相同的文件名前半段保留，只替换接收机编号；6表示接收机数，3表示每台的天线数。&quot;, &quot;terms&quot;: [[&quot;样本&quot;, &quot;一次动作的记录。这里一组样本包含6个接收机记录的6份文件。&quot;], [&quot;接收机&quot;, &quot;接收无线电波并记录测量结果的设备。它不是摄像头，也不会直接拍到人体。&quot;], [&quot;天线&quot;, &quot;设备收发无线电波的部件。每台接收机有3根接收天线，可以获得不同的信号记录。&quot;], [&quot;函数&quot;, &quot;一段有名字的办事步骤。调用函数，就像对一个已写好的流程说“请按这套步骤办一次”。&quot;], [&quot;路径 / 前缀&quot;, &quot;路径是文件在电脑中的地址；前缀是几个文件共同的名称部分。&quot;]]}, {&quot;label&quot;: &quot;解码与整理 CSI&quot;, &quot;origin&quot;: &quot;官方包附带工具&quot;, &quot;before&quot;: &quot;二进制 .dat&quot;, &quot;after&quot;: &quot;包数 × 90 个复数&quot;, &quot;kind&quot;: &quot;matrix&quot;, &quot;formula&quot;: &quot;H(t) ≈ H静态 + Σₗ αₗ(t)exp(jφₗ(t))；fD,ₗ(t) = (1/2π)·dφₗ/dt；90 = 3 根天线 × 30 条子载波&quot;, &quot;why&quot;: &quot;把密封的数据包拆开，再按“时刻 × 天线/子载波”摆整齐。read_bf_file/read_bfee 解析二进制；get_scaled_csi 结合 RSSI、噪声等校正幅度尺度；csi_get_all 将每包排成 90 列。原始接收机1有1479包；各接收机包数不完全相同。 人体运动改变反射路径长度，相位随之变化；相位随时间变化的速率对应多普勒。提取过程保留完整复数CSI，不是只使用你看到的幅度曲线。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;csi_tool_box/read_bf_file.m&quot;, &quot;first&quot;: 45, &quot;last&quot;: 53, &quot;text&quot;: &quot; 45  while cur &lt; (len - 3)\n 46      % Read size and code\n 47      field_len = fread(f, 1, &#x27;uint16&#x27;, 0, &#x27;ieee-be&#x27;);\n 48      code = fread(f,1);\n 49      cur = cur+3;\n 50      \n 51      % If unhandled code, skip (seek over) the record and continue\n 52      if (code == 187) % get beamforming or phy data\n 53          bytes = fread(f, field_len-1, &#x27;uint8=&gt;uint8&#x27;);&quot;}, {&quot;file&quot;: &quot;csi_tool_box/read_bf_file.m&quot;, &quot;first&quot;: 65, &quot;last&quot;: 67, &quot;text&quot;: &quot; 65      if (code == 187) %hex2dec(&#x27;bb&#x27;)) Beamforming matrix -- output a record\n 66          count = count + 1;\n 67          ret{count} = read_bfee(bytes);&quot;}, {&quot;file&quot;: &quot;csi_tool_box/get_scaled_csi.m&quot;, &quot;first&quot;: 10, &quot;last&quot;: 14, &quot;text&quot;: &quot; 10      csi_sq = csi .* conj(csi);\n 11      csi_pwr = sum(csi_sq(:));\n 12      rssi_pwr = dbinv(get_total_rss(csi_st));\n 13      %   Scale CSI -&gt; Signal power : rssi_pwr / (mean of csi_pwr)\n 14      scale = rssi_pwr / (csi_pwr / 30);&quot;}, {&quot;file&quot;: &quot;csi_tool_box/get_scaled_csi.m&quot;, &quot;first&quot;: 34, &quot;last&quot;: 40, &quot;text&quot;: &quot; 34      quant_error_pwr = scale * (csi_st.Nrx * csi_st.Ntx);\n 35  \n 36      % Total noise and error power\n 37      total_noise_pwr = thermal_noise_pwr + quant_error_pwr;\n 38  \n 39      % Ret now has units of sqrt(SNR) just like H in textbooks\n 40      ret = csi * sqrt(scale / total_noise_pwr);&quot;}, {&quot;file&quot;: &quot;csi_tool_box/csi_get_all.m&quot;, &quot;first&quot;: 1, &quot;last&quot;: 7, &quot;text&quot;: &quot;  1  function [cfr_array, timestamp] = csi_get_all(filename)\n  2  csi_trace = read_bf_file(filename);\n  3  timestamp = zeros(length(csi_trace), 1);\n  4  cfr_array = zeros(length(csi_trace), 90);\n  5  \n  6  for k = 1:length(csi_trace)\n  7      csi_entry = csi_trace{k}; % for the k_{th} packet&quot;}, {&quot;file&quot;: &quot;csi_tool_box/csi_get_all.m&quot;, &quot;first&quot;: 10, &quot;last&quot;: 19, &quot;text&quot;: &quot; 10          csi_all = squeeze(get_scaled_csi(csi_entry)).&#x27;; % estimate channel matrix Hexp-figu\n 11  %     catch err\n 12  %         disp(err)\n 13  %         continue\n 14  %     end\n 15      \n 16      csi = [csi_all(:,1); csi_all(:,2); csi_all(:, 3)].&#x27;; % select CSI for one antenna pair\n 17      \n 18      timestamp(k) = csi_entry.timestamp_low;\n 19      cfr_array(k,:) = csi;&quot;}], &quot;technicalWhy&quot;: &quot;read_bf_file/read_bfee解析已保存的CSI测量记录；get_scaled_csi结合RSSI、自动增益和噪声信息作尺度处理；csi_get_all把每包的三根接收天线、30条子载波排成90列。原始接收机1有1479包，各接收机包数不同。CSI由采集时接收机根据训练信号估计，不由此脚本从原始无线波形重新计算。&quot;, &quot;plainLabel&quot;: &quot;把数据包拆开，摆成表格&quot;, &quot;plainWhy&quot;: &quot;作者已经采集并保存了CSI测量记录。这里打开日志文件，取出每个包对应的CSI，校正数值尺度，再摆成表：一包占一行，三根天线各30条子载波排成90列。不是把CSI装进无线数据包，也没有重新采集无线电波。人体运动会使测量值变化，但CSI中也包含静态背景和设备误差。&quot;, &quot;formulaReading&quot;: &quot;H表示无线信道的测量值；它既记录“大小”，也记录“波走到哪一步”。Σ表示把多条传播路线的贡献加起来。相位变化有多快，可以用多普勒频率表示。&quot;, &quot;terms&quot;: [[&quot;CSI：信道状态信息&quot;, &quot;记录无线信号经过传播后变成什么样，像信号走完路留下的体检记录。它包含幅度和相位，不是一张人体照片。&quot;], [&quot;幅度&quot;, &quot;数值的大小。可以把信号画成一个箭头：箭头长短表示幅度。&quot;], [&quot;相位&quot;, &quot;一个周期进行到哪里。像钟表指针指到哪个角度；相位不是日期或时刻。&quot;], [&quot;复数&quot;, &quot;这里是同时保存箭头长度和方向的一种数学写法。“复”不表示重复，也不表示数据更神秘。&quot;], [&quot;子载波&quot;, &quot;Wi-Fi把传输任务分到多个不同的小频率通道。这组工具每根天线记录30条子载波。&quot;], [&quot;矩阵&quot;, &quot;一张装数字的表。1479×90就是1479行、90列；每行有3根天线各30个测量值。&quot;], [&quot;尺度校正 / RSSI&quot;, &quot;校正像把不同刻度的读数换到可比较的尺度；RSSI是设备记录的接收信号强弱信息。&quot;]]}, {&quot;label&quot;: &quot;时间戳与采样假设&quot;, &quot;origin&quot;: &quot;作者原代码 + 新增时间轴&quot;, &quot;before&quot;: &quot;CSI 数字表 + 另一列时间标签&quot;, &quot;after&quot;: &quot;按 1000 包/秒建立名义时间&quot;, &quot;kind&quot;: &quot;clock&quot;, &quot;formula&quot;: &quot;t名义[k] = (k−1)/1000 秒；真实包间隔由相邻时间戳的差计算&quot;, &quot;why&quot;: &quot;时间戳像每个包的接收时刻标签。csi_get_all第18行记录它，但get_doppler_spectrum用~忽略第二个输出，直接假设每秒1000包。若真实包间隔不均匀，名义时间和真实接收时间会不同。下面第二行只演示不均匀的可能情况，不是该样本真实时间戳。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;csi_tool_box/csi_get_all.m&quot;, &quot;first&quot;: 18, &quot;last&quot;: 19, &quot;text&quot;: &quot; 18      timestamp(k) = csi_entry.timestamp_low;\n 19      cfr_array(k,:) = csi;&quot;}, {&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 5, &quot;last&quot;: 6, &quot;text&quot;: &quot;  5  samp_rate = 1000;\n  6  half_rate = samp_rate / 2;&quot;}, {&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 19, &quot;last&quot;: 21, &quot;text&quot;: &quot; 19  [csi_data, ~] = csi_get_all([spfx_ges, &#x27;-r&#x27;, num2str(1), &#x27;.dat&#x27;]);\n 20  doppler_spectrum = zeros(rx_cnt, 1+freq_lpf_positive_max + freq_lpf_negative_min,...\n 21      floor(size(csi_data, 1)));&quot;}, {&quot;file&quot;: &quot;step1_csi_to_dfs.m&quot;, &quot;first&quot;: 32, &quot;last&quot;: 33, &quot;text&quot;: &quot; 32  sample_rate_hz = 1000; % Official code assumes a nominal 1000 packets/s.\n 33  time_s = (0:size(doppler_spectrum,3)-1)/sample_rate_hz;&quot;}], &quot;technicalWhy&quot;: &quot;时间戳像每个包的接收时刻标签。csi_get_all第18行记录它，但get_doppler_spectrum用~忽略第二个输出，直接假设每秒1000包。若真实包间隔不均匀，名义时间和真实接收时间会不同。下面第二行只演示不均匀的可能情况，不是该样本真实时间戳。&quot;, &quot;plainLabel&quot;: &quot;看看每个包什么时候到&quot;, &quot;plainWhy&quot;: &quot;读取函数返回两份东西：一张CSI表，和另一列接收时间标签。CSI的第1行对应时间标签第1个值，依次对应。代码没有使用这列标签，而是假设每包相隔1毫秒。因此图上时间按包编号推算，不是电脑执行频谱计算的时刻。&quot;, &quot;formulaReading&quot;: &quot;第1包当作0秒，第2包当作0.001秒，第3包当作0.002秒。真实间隔要用真实时间标签相减，不能仅靠包编号判断。&quot;, &quot;terms&quot;: [[&quot;时间戳&quot;, &quot;记录一个包何时被设备收到的计时数值，不一定是“晚上几点”的日历时间。&quot;], [&quot;采样&quot;, &quot;把连续变化的情况隔一段时间记录一次，像每隔一会儿拍一张照片。&quot;], [&quot;采样率&quot;, &quot;每秒记录多少次。1000次/秒意味着名义间隔是0.001秒。&quot;], [&quot;名义时间&quot;, &quot;按“每包间隔相同”的假设算出来的时间，尚未按真实时间标签校正。&quot;], [&quot;~&quot;, &quot;MATLAB里的这个符号表示：函数给了我这一项结果，但这次我不接收它。&quot;]]}, {&quot;label&quot;: &quot;选择参考天线&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;Tᵣ × 90&quot;, &quot;after&quot;: &quot;参考 CSI：Tᵣ × 90&quot;, &quot;kind&quot;: &quot;reference&quot;, &quot;formula&quot;: &quot;q[a,s] = meanₜ|H| / stdₜ|H|；a* = argmaxₐ meanₛ q[a,s]&quot;, &quot;why&quot;: &quot;像在三把尺子中选一把读数较强、波动较小的当参照。mean 沿时间计算，reshape 将90个比值变成30×3，再比较三根天线。repmat 将被选天线的30条子载波复制三遍，使每条待处理CSI都有对应的参考。不是选择第几个接收机。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 36, &quot;last&quot;: 41, &quot;text&quot;: &quot; 36      csi_mean = mean(abs(csi_data));\n 37      csi_var = sqrt(var(abs(csi_data)));\n 38      csi_mean_var_ratio = csi_mean./csi_var;\n 39      [~,idx] = max(mean(reshape(csi_mean_var_ratio,[30 rx_acnt]),1));\n 40  %     idx = 1;\n 41      csi_data_ref = repmat(csi_data(:,(idx-1)*30+1:idx*30), 1, rx_acnt);&quot;}], &quot;technicalWhy&quot;: &quot;像在三把尺子中选一把读数较强、波动较小的当参照。mean 沿时间计算，reshape 将90个比值变成30×3，再比较三根天线。repmat 将被选天线的30条子载波复制三遍，使每条待处理CSI都有对应的参考。不是选择第几个接收机。&quot;, &quot;plainLabel&quot;: &quot;选一根天线当参照&quot;, &quot;plainWhy&quot;: &quot;三个观测位置需要一个比较基准。代码在每台接收机的3根天线中，选出读数相对较强、变化相对较小的一根当参照。像量东西时，先选一把比较稳的尺子。然后把这根天线的30条记录复制三遍，方便与其他记录逐个比较。&quot;, &quot;formulaReading&quot;: &quot;先算每列读数的平均大小，再除以这列读数的波动大小；每根天线的30个比值再取平均，选择最大的那根。&quot;, &quot;terms&quot;: [[&quot;参考天线&quot;, &quot;被选来作比较基准的一根天线。每台接收机各选自己的参照。&quot;], [&quot;平均值 / mean&quot;, &quot;把数字加起来，再除以个数。例如2、4、6的平均值是4。&quot;], [&quot;标准差 / std&quot;, &quot;表示读数通常离平均值有多远。10、10、10没有波动；8、10、12有波动。&quot;], [&quot;方差 / var&quot;, &quot;另一种衡量波动的数值；这段代码用sqrt(var(...))得到标准差。&quot;], [&quot;reshape&quot;, &quot;数字不变，只改变它们在表格里的摆放方式。这里把90个比值摆成30行、3列。&quot;], [&quot;repmat&quot;, &quot;把同一份数字按指定次数复制、拼接；这里复制的是参考天线数据。&quot;]]}, {&quot;label&quot;: &quot;调整 CSI 幅度&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;两组 Tᵣ × 90 复数&quot;, &quot;after&quot;: &quot;调整后的两组复数&quot;, &quot;kind&quot;: &quot;amplitude&quot;, &quot;formula&quot;: &quot;αⱼ = min(|Hⱼ| 中的非零值)；H′ⱼ = ||Hⱼ|−αⱼ| · exp(j·angle Hⱼ)；β = 1000·meanⱼ αⱼ&quot;, &quot;why&quot;: &quot;把待处理幅度减去基线，把参考幅度加上偏置，保留两者相位，为后面的共轭处理调整静态背景与动态变化的相对强度。α 是最小非零幅度，β 是作者经验设置；这不等于精确去除了墙壁等全部静态反射。图是教学示意。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 44, &quot;last&quot;: 55, &quot;text&quot;: &quot; 44      csi_data_adj = zeros(size(csi_data));\n 45      csi_data_ref_adj = zeros(size(csi_data_ref));\n 46      alpha_sum = 0;\n 47      for jj = 1:30*rx_acnt\n 48          amp = abs(csi_data(:,jj));\n 49          alpha = min(amp(amp~=0));\n 50          alpha_sum = alpha_sum + alpha;\n 51          csi_data_adj(:,jj) = abs(abs(csi_data(:,jj))-alpha).*exp(1j*angle(csi_data(:,jj)));\n 52      end\n 53      beta = 1000*alpha_sum/(30*rx_acnt);\n 54      for jj = 1:30*rx_acnt\n 55          csi_data_ref_adj(:,jj) = (abs(csi_data_ref(:,jj))+beta).*exp(1j*angle(csi_data_ref(:,jj)));&quot;}], &quot;technicalWhy&quot;: &quot;把待处理幅度减去基线，把参考幅度加上偏置，保留两者相位，为后面的共轭处理调整静态背景与动态变化的相对强度。α 是最小非零幅度，β 是作者经验设置；这不等于精确去除了墙壁等全部静态反射。图是教学示意。&quot;, &quot;plainLabel&quot;: &quot;减一点底子，调整参照的大小&quot;, &quot;plainWhy&quot;: &quot;一条记录可以想成“比较固定的底子上，叠着不断变化的部分”。作者从各条记录的大小中减去一个底子，让变化更容易参与后面的处理；又把参考记录整体加大一点。这个操作保留了相位信息。它是一种经验做法，不是把墙壁的影响准确地全部删掉。&quot;, &quot;formulaReading&quot;: &quot;α是这一列最小的非零幅度；从各时刻幅度减去它。β是根据各列α算出的较大偏置，把参考幅度加上它。角度信息不变。&quot;, &quot;terms&quot;: [[&quot;基线 / α&quot;, &quot;这段代码选出来、准备减去的幅度底子；取该列最小的非零幅度。&quot;], [&quot;偏置 / β&quot;, &quot;给参考幅度整体加上的一个数，像把整排刻度抬高一点。&quot;], [&quot;静态分量&quot;, &quot;主要来自不动的传播路线，随时间变化较慢。实际环境中也可能有慢变化。&quot;], [&quot;动态分量&quot;, &quot;主要来自发生运动、导致信号随时间变化的传播路线。&quot;], [&quot;abs / angle&quot;, &quot;abs取复数箭头的长度；angle取箭头的角度。&quot;], [&quot;exp(j·角度)&quot;, &quot;一种按指定角度写出方向的数学表达；再乘幅度，就写出了完整复数。&quot;]]}, {&quot;label&quot;: &quot;共轭相乘&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;Tᵣ × 90&quot;, &quot;after&quot;: &quot;Tᵣ × 60&quot;, &quot;kind&quot;: &quot;conjugate&quot;, &quot;formula&quot;: &quot;(H₁eⁱᵋ)·conj(Hᵣₑ𝒻eⁱᵋ) = H₁·conj(Hᵣₑ𝒻)&quot;, &quot;why&quot;: &quot;像两把尺子同时偏了相同的角度，比较它们时共同偏差相消。同一接收机两根天线共享的相位误差可在共轭相乘中抵消。conj 是复共轭，.* 是对应元素相乘。第60行删除参考天线与自身相乘的30列，剩下两根非参考天线的60列。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 59, &quot;last&quot;: 60, &quot;text&quot;: &quot; 59      conj_mult = csi_data_adj .* conj(csi_data_ref_adj);\n 60      conj_mult = [conj_mult(:,1:30*(idx - 1)) conj_mult(:,30*idx+1:90)];&quot;}], &quot;technicalWhy&quot;: &quot;像两把尺子同时偏了相同的角度，比较它们时共同偏差相消。同一接收机两根天线共享的相位误差可在共轭相乘中抵消。conj 是复共轭，.* 是对应元素相乘。第60行删除参考天线与自身相乘的30列，剩下两根非参考天线的60列。&quot;, &quot;plainLabel&quot;: &quot;比较两路，抵消共同的相位偏差&quot;, &quot;plainWhy&quot;: &quot;假设两只钟表都一起多转了一点，直接读它们都带有偏差，但比较两只表指针之间的角度时，共同多转的部分可以抵消。作者利用同一接收机不同天线共享的部分相位偏差，用“共轭相乘”做这样的比较。随后删掉参考天线与自己比较的30列，留下60列。&quot;, &quot;formulaReading&quot;: &quot;把参考记录的角度反过来，再与另一条记录相乘；乘积的角度相当于两路角度相减。相同的偏差因此相消。&quot;, &quot;terms&quot;: [[&quot;共轭 / conj&quot;, &quot;对于复数箭头，长度不变，角度变为相反数。可以理解为把它关于水平轴翻转。&quot;], [&quot;共轭相乘&quot;, &quot;一路记录乘以参考记录的共轭；从角度上看，得到两路角度之差。&quot;], [&quot;共同相位偏差&quot;, &quot;两路测量同时带上的同一部分角度误差，比如来自接收设备的某些误差。&quot;], [&quot;.*&quot;, &quot;按对应位置相乘：第一格乘第一格、第二格乘第二格。不是普通矩阵乘法。&quot;], [&quot;90列 → 60列&quot;, &quot;删除参考天线自身的30列，留下另外两根天线各30列。&quot;]]}, {&quot;label&quot;: &quot;滤波&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;Tᵣ × 60&quot;, &quot;after&quot;: &quot;Tᵣ × 60&quot;, &quot;kind&quot;: &quot;filter&quot;, &quot;formula&quot;: &quot;Y = HighPass₂Hz(LowPass₆₀Hz(X))；归一化截止频率 = 截止 Hz / (1000/2)&quot;, &quot;why&quot;: &quot;像筛掉不动的背景与太快的抖动，保留任务关注的变化。60 Hz 低通抑制较高频分量；2 Hz 高通抑制静态和缓慢变化。samp_rate=1000是作者假设，500是奈奎斯特频率。它们是本任务的设置，不是所有人体动作的通用参数。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 5, &quot;last&quot;: 12, &quot;text&quot;: &quot;  5  samp_rate = 1000;\n  6  half_rate = samp_rate / 2;\n  7  uppe_orde = 6;\n  8  uppe_stop = 60;\n  9  lowe_orde = 3;\n 10  lowe_stop = 2;\n 11  [lu,ld] = butter(uppe_orde,uppe_stop/half_rate,&#x27;low&#x27;);\n 12  [hu,hd] = butter(lowe_orde,lowe_stop/half_rate,&#x27;high&#x27;);&quot;}, {&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 63, &quot;last&quot;: 66, &quot;text&quot;: &quot; 63      for jj = 1:size(conj_mult, 2)\n 64          conj_mult(:,jj) = filter(lu, ld, conj_mult(:,jj));\n 65          conj_mult(:,jj) = filter(hu, hd, conj_mult(:,jj));\n 66      end&quot;}], &quot;technicalWhy&quot;: &quot;像筛掉不动的背景与太快的抖动，保留任务关注的变化。60 Hz 低通抑制较高频分量；2 Hz 高通抑制静态和缓慢变化。samp_rate=1000是作者假设，500是奈奎斯特频率。它们是本任务的设置，不是所有人体动作的通用参数。&quot;, &quot;plainLabel&quot;: &quot;筛掉太慢和太快的变化&quot;, &quot;plainWhy&quot;: &quot;像筛米时把不需要的东西筛出去。这里筛的是信号变化：很慢的变化常含不动背景，过快的变化可能含不需要的抖动。作者用两道筛子，压低很慢和很快的部分，保留这个动作任务关注的变化。筛子有过渡区，不是到了界线就突然完全消失。&quot;, &quot;formulaReading&quot;: &quot;先低通，压低60Hz以上的分量；再高通，压低2Hz以下的分量。代码把截止数值除以500，是MATLAB设计这类滤波器所用的输入格式。&quot;, &quot;terms&quot;: [[&quot;滤波&quot;, &quot;按变化快慢调整信号各部分的强弱，像为记录加上不同的筛选规则。&quot;], [&quot;频率 / Hz&quot;, &quot;某种周期变化每秒进行多少次；1Hz表示每秒1个周期。这不是说人每秒挥了多少次手。&quot;], [&quot;低通&quot;, &quot;让较慢的变化较容易保留，压低较快的变化。&quot;], [&quot;高通&quot;, &quot;让较快的变化较容易保留，压低较慢的变化。&quot;], [&quot;奈奎斯特频率&quot;, &quot;采样率的一半。这里1000÷2=500Hz；它是设置滤波器时的基准，不是人体运动速度。&quot;], [&quot;滤波器阶数&quot;, &quot;影响筛选曲线形状和陡峭程度的设置。代码中的6和3是阶数，60和2才是截止频率。&quot;]]}, {&quot;label&quot;: &quot;PCA 合成一条序列&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;Tᵣ × 60&quot;, &quot;after&quot;: &quot;Tᵣ × 1&quot;, &quot;kind&quot;: &quot;pca&quot;, &quot;formula&quot;: &quot;z = Xw₁；w₁ 为 PCA 的第一主成分系数&quot;, &quot;why&quot;: &quot;像把60位观测者的变化加权合成一条主线。pca 返回组合权重，第一列对应最大方差方向；矩阵乘法将60列合成1列。代码直接对未另行减均值的conj_mult投影。PCA寻找变化最强的方向，不保证其全部来自人体运动。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 69, &quot;last&quot;: 70, &quot;text&quot;: &quot; 69      pca_coef = pca(conj_mult);\n 70      conj_mult_pca = conj_mult * pca_coef(:,1);&quot;}], &quot;technicalWhy&quot;: &quot;像把60位观测者的变化加权合成一条主线。pca 返回组合权重，第一列对应最大方差方向；矩阵乘法将60列合成1列。代码直接对未另行减均值的conj_mult投影。PCA寻找变化最强的方向，不保证其全部来自人体运动。&quot;, &quot;plainLabel&quot;: &quot;把60条记录合成一条主线&quot;, &quot;plainWhy&quot;: &quot;同一动作留下60条记录，很多变化是互相相关的。作者用PCA给各条记录分配组合权重，合成一条变化比较显著的主线。像从许多人一起说的话中找最明显的共同变化。但如果某种噪声变化也很大，它也可能被保留下来。&quot;, &quot;formulaReading&quot;: &quot;X是60列记录；w₁是一组组合权重。把它们相乘得到一列z。第一主成分指组合后变化程度最大的那个方向。&quot;, &quot;terms&quot;: [[&quot;PCA：主成分分析&quot;, &quot;一种把多列相关记录组合、压缩的方法。这段代码只保留第一种组合结果。&quot;], [&quot;主成分&quot;, &quot;根据一组权重算出的综合记录，不是“人体最主要的部位”。&quot;], [&quot;权重&quot;, &quot;决定每条记录在组合时贡献多少、以什么符号贡献的系数；可以是负数，在这里也可能是复数。&quot;], [&quot;最大方差&quot;, &quot;组合后的数值变化程度最大；不是“识别准确率最高”的保证。&quot;], [&quot;降维&quot;, &quot;减少描述数据所用的列数。这里60列变成1列。&quot;], [&quot;*&quot;, &quot;此处为矩阵乘法：按权重把各列组合起来；与逐格相乘的.*不同。&quot;]]}, {&quot;label&quot;: &quot;STFT → DFS&quot;, &quot;origin&quot;: &quot;作者原代码 + 新增保存入口&quot;, &quot;before&quot;: &quot;Tᵣ × 1&quot;, &quot;after&quot;: &quot;6 × 121 × 1479&quot;, &quot;kind&quot;: &quot;dfs&quot;, &quot;formula&quot;: &quot;S(k,m) = |Σₙ z[n]wₘ[n]exp(−j·2πkn/1000)|²；D(k,m) = S(k,m)/ΣₖS(k,m)&quot;, &quot;why&quot;: &quot;像用一个短时间窗口沿信号移动，每次听里面有哪些频率。高斯窗251点，FFT为1000点，tfrsp返回功率谱。取−60至60 Hz共121格并逐时刻归一化，再存六路DFS。频率格点1 Hz不代表实际分辨率1 Hz。各路按r1长度截断或补零；没有按时间戳重采样。这里图取自你上传的DFS.mat。 第33行的1:1:实际上保留全部数据包，未降采样。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 77, &quot;last&quot;: 83, &quot;text&quot;: &quot; 77              time_instance = 1:length(conj_mult_pca);\n 78              window_size = round(samp_rate/4+1);\n 79              if(~mod(window_size,2))\n 80                  window_size = window_size + 1;\n 81              end\n 82              freq_time_prof_allfreq = tfrsp(conj_mult_pca, time_instance,...\n 83                  samp_rate, tftb_window(window_size, &#x27;gauss&#x27;));&quot;}, {&quot;file&quot;: &quot;tftb/mfiles/tfrsp.m&quot;, &quot;first&quot;: 83, &quot;last&quot;: 89, &quot;text&quot;: &quot; 83  for icol=1:tcol,\n 84   ti= t(icol); tau=-min([round(N/2)-1,Lh,ti-1]):min([round(N/2)-1,Lh,xrow-ti]);\n 85   indices= rem(N+tau,N)+1; \n 86   if trace, disprog(icol,tcol,10); end;\n 87   tfr(indices,icol)=x(ti+tau).*conj(h(Lh+1+tau))/norm(h(Lh+1+tau));\n 88  end;\n 89  tfr=abs(fft(tfr)).^2; &quot;}, {&quot;file&quot;: &quot;get_doppler_spectrum.m&quot;, &quot;first&quot;: 88, &quot;last&quot;: 101, &quot;text&quot;: &quot; 88      freq_time_prof = freq_time_prof_allfreq(freq_lpf_sele, :);\n 89      % Spectrum Normalization By Sum For Each Snapshot\n 90      freq_time_prof = abs(freq_time_prof) ./ repmat(sum(abs(freq_time_prof),1),...\n 91          size(freq_time_prof,1), 1);\n 92      \n 93      % Frequency Bin(Corresponding to FFT Results)\n 94      freq_bin = [0:freq_lpf_positive_max -1*freq_lpf_negative_min:-1];\n 95  \n 96      % Store Doppler Velocity Spectrum\n 97      if(size(freq_time_prof,2) &gt;= size(doppler_spectrum,3))\n 98          doppler_spectrum(ii,:,:) = freq_time_prof(:,1:size(doppler_spectrum,3));\n 99      else\n100          doppler_spectrum(ii,:,:) = [freq_time_prof zeros(size(doppler_spectrum,2),...\n101              size(doppler_spectrum,3) - size(freq_time_prof,2))];&quot;}, {&quot;file&quot;: &quot;step1_csi_to_dfs.m&quot;, &quot;first&quot;: 23, &quot;last&quot;: 24, &quot;text&quot;: &quot; 23  [freq_bin,order] = sort(freq_fft);\n 24  doppler_spectrum = dfs_fft(:,order,:);&quot;}, {&quot;file&quot;: &quot;step1_csi_to_dfs.m&quot;, &quot;first&quot;: 32, &quot;last&quot;: 35, &quot;text&quot;: &quot; 32  sample_rate_hz = 1000; % Official code assumes a nominal 1000 packets/s.\n 33  time_s = (0:size(doppler_spectrum,3)-1)/sample_rate_hz;\n 34  save(fullfile(outdir,&#x27;DFS.mat&#x27;),&#x27;doppler_spectrum&#x27;,&#x27;freq_bin&#x27;, ...\n 35      &#x27;time_s&#x27;,&#x27;sample_rate_hz&#x27;,&#x27;sample&#x27;,&#x27;dfs_seconds&#x27;);&quot;}], &quot;technicalWhy&quot;: &quot;像用一个短时间窗口沿信号移动，每次听里面有哪些频率。高斯窗251点，FFT为1000点，tfrsp返回功率谱。取−60至60 Hz共121格并逐时刻归一化，再存六路DFS。频率格点1 Hz不代表实际分辨率1 Hz。各路按r1长度截断或补零；没有按时间戳重采样。这里图取自你上传的DFS.mat。 第33行的1:1:实际上保留全部数据包，未降采样。&quot;, &quot;plainLabel&quot;: &quot;逐小段看变化的频率&quot;, &quot;plainWhy&quot;: &quot;每次从原记录取251点，像拿一个约0.25秒的小窗口看信号；窗口中心按第1点、第2点、第3点依次移动，窗口大量重叠。每个窗口算出一份频率功率表，并记住它在原记录的中心位置。把这些结果按时间排成列，就是DFS图。时间顺序没有重新打乱。这里显示的是你上传的真实DFS。&quot;, &quot;formulaReading&quot;: &quot;对每个小窗口分别做FFT，取结果大小平方，然后保留目标频率、按每列总功率归一化。每个窗口的输出就是一份频谱快照，不需要另拍照片；时间标签表示窗口在原记录中的位置。&quot;, &quot;terms&quot;: [[&quot;STFT：短时傅里叶分析&quot;, &quot;在一个个短时间窗口中分别检查频率，从而保留“什么时候出现哪种频率”的信息。&quot;], [&quot;FFT&quot;, &quot;一种快速计算频率成分的方法。像把混合的变化拆成不同快慢的周期成分。&quot;], [&quot;窗口 / 高斯窗&quot;, &quot;窗口是当前查看的一小段记录；高斯窗让中间部分权重较大、边缘较小，减轻生硬截断的影响。&quot;], [&quot;多普勒&quot;, &quot;运动改变传播路径，使接收到的相位持续变化所对应的频率。可以借救护车经过时音调变化来理解“运动会影响接收信号”；这里不是测声音。&quot;], [&quot;DFS：多普勒频谱&quot;, &quot;在各个时刻，多普勒频率分别有多强的一张表或图。&quot;], [&quot;功率谱&quot;, &quot;表示各个频率成分有多强。这里计算为频率分析结果的大小平方。&quot;], [&quot;归一化&quot;, &quot;把不同记录换到共同的比较尺度。这里每个时刻所有频率格的功率加起来约为1。&quot;], [&quot;分辨率&quot;, &quot;区分两个很接近的频率的能力。画了1Hz间隔的格子，不代表能真的分清相差1Hz的两种运动。&quot;]]}, {&quot;label&quot;: &quot;100 快照分段&quot;, &quot;origin&quot;: &quot;我新增的入口，沿用作者设置&quot;, &quot;before&quot;: &quot;6 × 121 × 1479&quot;, &quot;after&quot;: &quot;14 组 6 × 121&quot;, &quot;kind&quot;: &quot;segment&quot;, &quot;formula&quot;: &quot;D̄ᵣ[k,q] = meanₘ∈第q段 Dᵣ[k,m]；段数 = floor(1479/100) = 14&quot;, &quot;why&quot;: &quot;像把连续视频每100个快照整理成一页，估计这一段的速度功率分布。每100个DFS快照求平均，名义上0.1秒；不是另用100点窗重做STFT。末尾79个快照舍弃。再将接收机总功率对齐到r1，以补偿链路整体强弱的影响。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 23, &quot;last&quot;: 29, &quot;text&quot;: &quot; 23  seg_length = 100;\n 24  velocity_bin = (-9:10)*0.2; % Official grid: -1.8 to 2.0 m/s.\n 25  M = numel(velocity_bin);\n 26  lambda = 1e-7;\n 27  sparsity_norm = 0;\n 28  max_function_evaluations = 100000;\n 29  seg_number = floor(size(doppler_spectrum,3)/seg_length);&quot;}, {&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 45, &quot;last&quot;: 51, &quot;text&quot;: &quot; 45  for ii = 1:seg_number\n 46      target = mean(doppler_spectrum(:,:,(ii-1)*seg_length+1:ii*seg_length),3);\n 47      assert(all(isfinite(target(:))) &amp;&amp; all(sum(target,2)&gt;0), ...\n 48          &#x27;Segment %d has invalid or missing-link DFS.&#x27;,ii);\n 49      for r = 2:rx_cnt\n 50          target(r,:) = target(r,:)*sum(target(1,:))/sum(target(r,:));\n 51      end&quot;}], &quot;technicalWhy&quot;: &quot;像把连续视频每100个快照整理成一页，估计这一段的速度功率分布。每100个DFS快照求平均，名义上0.1秒；不是另用100点窗重做STFT。末尾79个快照舍弃。再将接收机总功率对齐到r1，以补偿链路整体强弱的影响。 100个内部窗口中心跨度约0.1秒，但由于各窗口长约0.25秒，原信号影响范围约0.35秒。它不是单独从0.1秒原始数据重新做一次FFT。&quot;, &quot;plainLabel&quot;: &quot;每100张频谱快照整理成一段&quot;, &quot;plainWhy&quot;: &quot;频谱快照只是一个窗口算出的一列频率功率值；在DFS图里已经按时间排好。现在每100列放成一组，把同一频率格的数值平均，再求一次BVP。100是作者选用的参数，能减少波动和求解次数，但会减少时间细节。100个中心相隔约0.1秒，不是100个互不重叠的0.25秒窗口。&quot;, &quot;formulaReading&quot;: &quot;每个接收机的每个频率格，在100个快照中取平均；1479÷100只能得到14个完整组。还把不同接收机的总功率调到同一水平。&quot;, &quot;terms&quot;: [[&quot;快照&quot;, &quot;这里指一个时刻的频谱记录，不是摄像头拍下的人体照片。&quot;], [&quot;分段&quot;, &quot;按先后顺序把记录分成较短的时间组。&quot;], [&quot;6×121&quot;, &quot;一段平均频谱：6个接收机，每个有121个频率格。&quot;], [&quot;传播损耗&quot;, &quot;信号在传播中会变弱，各条路线整体强弱可能不同。代码用总功率对齐作近似补偿。&quot;], [&quot;floor&quot;, &quot;向下取整。14.79取14，只保留完整的14段。&quot;]]}, {&quot;label&quot;: &quot;几何与速度映射&quot;, &quot;origin&quot;: &quot;作者原代码 + 新增调用入口&quot;, &quot;before&quot;: &quot;位置 + 400 种候选速度&quot;, &quot;after&quot;: &quot;VDM：20 × 20 × 6 × 121&quot;, &quot;kind&quot;: &quot;geometry&quot;, &quot;formula&quot;: &quot;aᵣ = (p−Tx)/‖p−Tx‖ + (p−Rxᵣ)/‖p−Rxᵣ‖；fᵣ(v) = round(aᵣ·v / λwave)&quot;, &quot;why&quot;: &quot;每条无线链路像从不同方向观察运动。人体移动会同时改变Tx→人体和人体→Rx两段距离，因此两个方向向量相加。按作者代码约定，同一个速度在六路上投影到六个频率。示意箭头选v=(0.4,−0.2)m/s，不是当前人体真实速度。几何按人体代表位置近似，正负号不能直接叫靠近/远离。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 16, &quot;last&quot;: 24, &quot;text&quot;: &quot; 16  torso_pos = [1.365 0.455];\n 17  torso_orientation_deg = -90;\n 18  Tx_pos = [0 0];\n 19  Rx_pos = [0.455 -0.455; 1.365 -0.455; 2.0 0; ...\n 20            -0.455 0.455; -0.455 1.365; 0 2.0];\n 21  rx_cnt = 6;\n 22  wave_length = 299792458/5.825e9;\n 23  seg_length = 100;\n 24  velocity_bin = (-9:10)*0.2; % Official grid: -1.8 to 2.0 m/s.&quot;}, {&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 31, &quot;last&quot;: 33, &quot;text&quot;: &quot; 31  A = get_A_matrix(torso_pos,Tx_pos,Rx_pos,rx_cnt);\n 32  VDM = permute(get_velocity2doppler_mapping_matrix(A,wave_length, ...\n 33      velocity_bin,freq_bin,rx_cnt),[2 3 1 4]);&quot;}, {&quot;file&quot;: &quot;get_A_matrix.m&quot;, &quot;first&quot;: 5, &quot;last&quot;: 11, &quot;text&quot;: &quot;  5      A = zeros(rxcnt,2);\n  6      \n  7      for ii = 1:rxcnt\n  8          dis_torso_tx = sqrt((torso_pos-Tx_pos) * (torso_pos-Tx_pos)&#x27;);\n  9          dis_torso_rx = sqrt((torso_pos-Rx_pos(ii,:)) * (torso_pos-Rx_pos(ii,:))&#x27;);\n 10          A(ii,:) = (torso_pos - Tx_pos)/dis_torso_tx + ...\n 11              (torso_pos - Rx_pos(ii,:))/dis_torso_rx;&quot;}, {&quot;file&quot;: &quot;Doppler2VelocityMapping/get_velocity2doppler_mapping_matrix.m&quot;, &quot;first&quot;: 16, &quot;last&quot;: 28, &quot;text&quot;: &quot; 16      VDM = zeros(rx_cnt, M, M, F);\n 17      % For Each Link\n 18      for ii = 1:rx_cnt\n 19          for i = 1:M\n 20              for j = 1:M\n 21                  plcr_hz = round(A(ii,:) * [velocity_bin(i) velocity_bin(j)]&#x27;...\n 22                      / wave_length);\n 23                  if plcr_hz &gt; freq_max || plcr_hz &lt; freq_min\n 24                      VDM(ii,i,j,:) = 1e10*ones(1,size(VDM,4));\n 25                      continue;\n 26                  end\n 27                  idx = plcr_hz + 1 - freq_min;\n 28                  VDM(ii,i,j,idx) = 1;&quot;}], &quot;technicalWhy&quot;: &quot;每条无线链路像从不同方向观察运动。人体移动会同时改变Tx→人体和人体→Rx两段距离，因此两个方向向量相加。按作者代码约定，同一个速度在六路上投影到六个频率。示意箭头选v=(0.4,−0.2)m/s，不是当前人体真实速度。几何按人体代表位置近似，正负号不能直接叫靠近/远离。&quot;, &quot;plainLabel&quot;: &quot;用设备位置算观察关系&quot;, &quot;plainWhy&quot;: &quot;设备位置让我们知道观察关系：假设反射点以某个速度运动，每个接收机应看到什么频率。它只给出对应规则，没有给出人实际采用了哪些速度。位置是另外提供的参数，不是CSI直接附带的人体坐标。示意速度箭头只是候选例子。&quot;, &quot;formulaReading&quot;: &quot;人体一动，发射器到人体、人体到接收机的两段路都可能变长或变短，把两段影响合起来，再除以波长。对400种候选二维速度分别算一次。&quot;, &quot;terms&quot;: [[&quot;几何关系&quot;, &quot;这里就是设备和人体的位置、方向关系。&quot;], [&quot;Tx / Rx&quot;, &quot;Tx是发射器；Rx是接收器。Rx1就是第1个接收机。&quot;], [&quot;波长 / wave_length&quot;, &quot;电波一个周期在空间中占的长度。这里约5.15厘米，用它把路径变化与频率联系起来。&quot;], [&quot;速度分量 vx、vy&quot;, &quot;把一次运动拆成两个互相垂直方向上的速度；单位为米/秒。不是人体位置坐标。&quot;], [&quot;投影&quot;, &quot;一种运动从某条链路的观察方向看，会表现成什么样。这里把二维速度对应到一个频率。&quot;], [&quot;映射 / VDM&quot;, &quot;一张预先算好的对应表：哪个候选速度在第几个接收机上落到哪个频率格。&quot;], [&quot;round&quot;, &quot;取最接近的整数。约8.89Hz在这张对应表中记为9Hz。&quot;]]}, {&quot;label&quot;: &quot;反推功率分布 P&quot;, &quot;origin&quot;: &quot;作者原代码&quot;, &quot;before&quot;: &quot;候选 P：20 × 20&quot;, &quot;after&quot;: &quot;预测 DFS：6 × 121&quot;, &quot;kind&quot;: &quot;inverse&quot;, &quot;formula&quot;: &quot;D̂ᵣ[k] = Σᵢⱼ VDM[i,j,r,k]P[i,j]；minₚ≥₀ ΣᵣΣₖ|cumsum(D̂ᵣ−Dᵣ)[k]| + η·count(P≠0)&quot;, &quot;why&quot;: &quot;像用6张投影反推一张速度地图。一个格点不是身体位置，而是一种(vx,vy)；格点数值是功率。先将候选P投影成六路频谱，与真实DFS比较；累计差的绝对值构成作者EMD形式，能考虑频率格点间距离。L0项偏好少量非零格点。VDM/几何矩阵A名称不同，别混淆；代码lambda=1e−7是η，不是波长。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;Doppler2VelocityMapping/DVM_target_func.m&quot;, &quot;first&quot;: 12, &quot;last&quot;: 17, &quot;text&quot;: &quot; 12      M = size(P,1);\n 13      F = size(doppler_spectrum_seg_tgt,2);\n 14      P_extent = repmat(P, 1, 1, rx_cnt, F);\n 15      \n 16      % Construct Approximation Doppler Spectrum\n 17      doppler_spectrum_seg_approximate = squeeze(sum(squeeze(sum(P_extent .* VDM, 1)), 1));&quot;}, {&quot;file&quot;: &quot;Doppler2VelocityMapping/DVM_target_func.m&quot;, &quot;first&quot;: 21, &quot;last&quot;: 34, &quot;text&quot;: &quot; 21      floss = 0;\n 22      for ii = 1:rx_cnt\n 23          if(any(doppler_spectrum_seg_tgt(ii,:)))\n 24              floss = floss + sum(abs((doppler_spectrum_seg_approximate(ii,:)...\n 25                  - doppler_spectrum_seg_tgt(ii,:)) * triu(ones(F,F),0)));\n 26          end\n 27      end\n 28      % Norm Loss\n 29      if norm == 1\n 30          floss = floss + lambda * sum(sum(P));\n 31      else if norm == 0\n 32              floss = floss + lambda * sum(sum(P~=0));\n 33          end\n 34      end&quot;}], &quot;technicalWhy&quot;: &quot;像用6张投影反推一张速度地图。一个格点不是身体位置，而是一种(vx,vy)；格点数值是功率。先将候选P投影成六路频谱，与真实DFS比较；累计差的绝对值构成作者EMD形式，能考虑频率格点间距离。L0项偏好少量非零格点。VDM/几何矩阵A名称不同，别混淆；代码lambda=1e−7是η，不是波长。&quot;, &quot;plainLabel&quot;: &quot;反过来猜一张速度分布&quot;, &quot;plainWhy&quot;: &quot;反过来不是反过来拍，也没有再次采集。先猜一张速度功率表，按已知位置关系算出六路预测频谱，与实际DFS比较，再调整猜测。多个速度可能投影到相同频率，因此要同时比较六路并使用少量主要速度的先验。&quot;, &quot;formulaReading&quot;: &quot;把所有落入同一个频率格的候选功率加起来，就是预测频谱。目标是预测和实际尽量接近，同时减少不必要的非零速度格。&quot;, &quot;terms&quot;: [[&quot;BVP：人体坐标系速度分布&quot;, &quot;一张“相对于人体自身朝向，各种速度分别有多少信号功率”的表。不是人体画像或行走路线。&quot;], [&quot;P / 候选功率表&quot;, &quot;优化器当前猜的一张速度功率表；每个格子是一种(vx,vy)。&quot;], [&quot;反推 / 反演&quot;, &quot;已知观测结果，利用关系模型估计造成它的运动分布。像看几个方向的影子去推测物体，但结果可能不唯一。&quot;], [&quot;EMD：搬土距离&quot;, &quot;把一个频率分布搬成另一个，需要搬多远的一种差异指标；相邻峰比相隔很远的峰更容易对齐。代码用累计功率差的绝对值求和来实现。&quot;], [&quot;稀疏 / L0&quot;, &quot;稀疏是只让少数格子有值；L0在这里数有多少格不为0。作者用它表达“少量主要速度”的偏好。&quot;], [&quot;惩罚系数 η / 代码lambda&quot;, &quot;决定“少用格子”在目标里占多大权重。这里为1e−7；不是波长。&quot;], [&quot;cumsum / triu&quot;, &quot;cumsum是从左到右不断累加；这里乘上triu产生的上三角全1表，起到同样的累计作用。&quot;]]}, {&quot;label&quot;: &quot;优化求解&quot;, &quot;origin&quot;: &quot;我新增的入口，沿用作者算法&quot;, &quot;before&quot;: &quot;每段 400 个未知功率&quot;, &quot;after&quot;: &quot;20 × 20 × 14&quot;, &quot;kind&quot;: &quot;optimize&quot;, &quot;formula&quot;: &quot;0 ≤ P[i,j] ≤ U_bound[i,j]；P* = fmincon(目标函数, 初值, 边界)&quot;, &quot;why&quot;: &quot;每段从全零P出发，fmincon反复改变功率，使六路预测DFS更接近观测，并加入稀疏惩罚。这里是物理模型的数值优化，没有训练神经网络。所有段的exit_flag=1表示求解器满足停止条件；原目标含非光滑/不连续项，不能据此保证全局最优或唯一解。此图为你保存的场景坐标系结果，非优化过程动画。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 34, &quot;last&quot;: 41, &quot;text&quot;: &quot; 34  U_bound = repmat(max(doppler_spectrum(:)),M,M);\n 35  velocity_spectrum = zeros(M,M,seg_number);\n 36  exit_flags = zeros(seg_number,1);\n 37  objectives = zeros(seg_number,1);\n 38  segment_seconds = zeros(seg_number,1);\n 39  function_counts = zeros(seg_number,1);\n 40  options = optimoptions(&#x27;fmincon&#x27;,&#x27;Algorithm&#x27;,&#x27;sqp&#x27;, ...\n 41      &#x27;MaxFunctionEvaluations&#x27;,max_function_evaluations,&#x27;Display&#x27;,&#x27;off&#x27;);&quot;}, {&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 53, &quot;last&quot;: 63, &quot;text&quot;: &quot; 53      [P,fval,flag,info] = fmincon(@(P)DVM_target_func(P,VDM,lambda, ...\n 54          target,rx_cnt,sparsity_norm),zeros(M,M),[],[],[],[], ...\n 55          zeros(M,M),U_bound,[],options);\n 56      assert(all(isfinite(P(:))),&#x27;Invalid solution for segment %d.&#x27;,ii);\n 57      velocity_spectrum(:,:,ii) = P;\n 58      exit_flags(ii) = flag;\n 59      objectives(ii) = fval;\n 60      segment_seconds(ii) = toc(segment_timer);\n 61      function_counts(ii) = info.funcCount;\n 62      fprintf(&#x27;Segment %d/%d: exit flag %d, objective %.6g, %.1f s\\n&#x27;, ...\n 63          ii,seg_number,flag,fval,segment_seconds(ii));&quot;}], &quot;technicalWhy&quot;: &quot;每段从全零P出发，fmincon反复改变功率，使六路预测DFS更接近观测，并加入稀疏惩罚。这里是物理模型的数值优化，没有训练神经网络。所有段的exit_flag=1表示求解器满足停止条件；原目标含非光滑/不连续项，不能据此保证全局最优或唯一解。此图为你保存的场景坐标系结果，非优化过程动画。&quot;, &quot;plainLabel&quot;: &quot;让电脑反复试，降低误差&quot;, &quot;plainWhy&quot;: &quot;电脑先把400个速度格子的功率设为0，再不断调整：这一次预测像不像实际频谱？如果目标值下降，就继续寻找。就像反复调配比例，让做出的结果更接近目标。这个过程使用数值求解器，不是在训练一个神经网络；报告停止条件满足，也不等于只有这一个正确答案。&quot;, &quot;formulaReading&quot;: &quot;fmincon在指定边界内调整P，尝试降低“频谱差异+稀疏惩罚”。0≤P是功率不能为负；U_bound是作者实现采用的上限。&quot;, &quot;terms&quot;: [[&quot;优化&quot;, &quot;按一个明确的评价规则，不断调整数字，寻找更小的误差。&quot;], [&quot;目标函数 / loss&quot;, &quot;给当前猜测打分的计算规则。这里分数越小，表示越符合所设目标。&quot;], [&quot;fmincon&quot;, &quot;MATLAB中的一种带约束数值优化工具，是负责反复调整数字的“试配员”。&quot;], [&quot;约束 / 边界&quot;, &quot;求解时必须遵守的规则。这里功率不能为负，也不能超过设定上限。&quot;], [&quot;收敛 / exit_flag=1&quot;, &quot;求解器认为满足了它的停止条件；不是“人体真实速度已百分之百正确”的证明。&quot;], [&quot;局部最优 / 全局最优&quot;, &quot;局部最优像附近一小片地里较低的位置；全局最优才是整个范围最低的位置。该求解器不保证总能找到全局最优。&quot;]]}, {&quot;label&quot;: &quot;旋转到人体坐标&quot;, &quot;origin&quot;: &quot;作者原代码 + 新增调用入口&quot;, &quot;before&quot;: &quot;场景坐标速度分布&quot;, &quot;after&quot;: &quot;人体坐标 BVP：20 × 20 × 14&quot;, &quot;kind&quot;: &quot;bvp&quot;, &quot;formula&quot;: &quot;vbody = R(−θ)vscene（标准坐标约定）；代码按 imrotate 的图像索引约定旋转网格&quot;, &quot;why&quot;: &quot;像转动地图的坐标轴，让人体朝向成为正x方向。不能把标准二维向量旋转矩阵的符号直接照搬到图像数组；实际以作者get_rotated_spectrum函数为准。20格网格的零速度不在图像几何中心，因此先补成21×21，让零速度位于中心，旋转再裁回20×20。此图取你上传的BVP.mat第1段。&quot;, &quot;code&quot;: [{&quot;file&quot;: &quot;step2_dfs_to_bvp.m&quot;, &quot;first&quot;: 69, &quot;last&quot;: 74, &quot;text&quot;: &quot; 69  velocity_spectrum_ro = get_rotated_spectrum(velocity_spectrum,torso_orientation_deg);\n 70  segment_time_s = ((0:seg_number-1)*seg_length+(seg_length-1)/2)/S.sample_rate_hz;\n 71  save(fullfile(outdir,&#x27;BVP.mat&#x27;),&#x27;velocity_spectrum_ro&#x27;,&#x27;velocity_spectrum&#x27;, ...\n 72      &#x27;velocity_bin&#x27;,&#x27;segment_time_s&#x27;,&#x27;torso_pos&#x27;,&#x27;torso_orientation_deg&#x27;, ...\n 73   frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();

</script>
</body>
